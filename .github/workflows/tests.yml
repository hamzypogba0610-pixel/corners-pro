name: Tests du bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lancer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Lancer les tests
        run: |
          python test_product_law.py
          python test_schema.py
          python test_descriptive.py
          python test_hierarchical.py
          python test_xg_context.py
          python test_copula.py
          python test_pagerank.py
          python test_decision.py
          python test_score_effect.py
          python test_zero_inflation.py
          python test_sensitivity.py
          python test_backtest.py
          python test_league_factor.py
